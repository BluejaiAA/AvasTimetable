<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1030">
<title>Ava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#ffd23f; --amber:#ff9d2f; --space:#0b1030; --space2:#161c4a; --blue:#3d7bff; --cyan:#39d6e6;
    --red:#ff3b4e; --violet:#8a4fff; --green:#39c46e;
    --paper:#eef1fb; --card:#ffffff; --ink:#141a38; --ink-soft:#6d76a8; --line:#e2e6f7;
    --hot:#3d7bff; --lav:#8a4fff; --plum:#161c4a;
    --chunky:0 4px 0 rgba(11,16,48,.14), 0 12px 26px rgba(11,16,48,.14);
  }
  .s-reg{--c:#8a4fff;} .s-maths{--c:#a24fff;} .s-music{--c:#ff4fa3;} .s-welsh{--c:#ff2d92;}
  .s-ds{--c:#39d6e6;} .s-english{--c:#3d7bff;} .s-geog{--c:#3fb46e;} .s-tech{--c:#39c46e;}
  .s-re{--c:#9a6fff;} .s-history{--c:#ff8a3d;} .s-pse{--c:#2ab6a0;} .s-science{--c:#19c6c6;}
  .s-pe{--c:#ff7a3d;} .s-art{--c:#ff5fbf;} .s-french{--c:#6a63ff;} .s-drama{--c:#ff3b4e;}
  .s-pd{--c:#4f6bff;}

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Nunito',sans-serif; background:var(--paper);
    background-image:radial-gradient(circle at 12% 6%, rgba(255,210,63,.10), transparent 38%),radial-gradient(circle at 88% 14%, rgba(61,123,255,.12), transparent 42%);
    color:var(--ink); min-height:100vh; padding-bottom:44px; overflow-x:hidden; }
  .doodle { display:inline-block; vertical-align:middle; }

  .hero { background:linear-gradient(150deg,#0b1030 0%,#161c4a 55%,#3d2a6a 100%); color:#fff; padding:22px 22px 30px; border-radius:0 0 38px 38px; position:relative; overflow:hidden; box-shadow:0 10px 0 rgba(255,111,165,.22), 0 22px 40px rgba(255,111,165,.3); }
  .hero::before{ content:""; position:absolute; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.4),transparent 62%); top:-80px; right:-60px; }
  .sparkle { position:absolute; color:#fff; opacity:.9; pointer-events:none; }
  @keyframes twinkle { 0%,100%{ transform:scale(.7); opacity:.4;} 50%{ transform:scale(1.1); opacity:1;} }
  .datepill { display:inline-flex; align-items:center; gap:7px; font-weight:800; font-size:.82rem; background:rgba(255,255,255,.3); padding:7px 14px; border-radius:30px; position:relative; z-index:2; box-shadow:inset 0 0 0 2px rgba(255,255,255,.4); }
  .name { font-family:'Baloo 2',cursive; font-weight:800; font-size:2.7rem; line-height:1; margin-top:12px; position:relative; z-index:2; text-shadow:0 2px 12px rgba(122,74,99,.3); letter-spacing:-.5px; }
  .name .hearts { font-size:1.6rem; }
  .lyric { font-weight:700; font-size:1.05rem; line-height:1.4; margin-top:12px; position:relative; z-index:2; max-width:32ch; }
  .lyric .credit { display:block; font-weight:700; font-size:.72rem; opacity:.85; margin-top:5px; }

  .chips { display:flex; gap:9px; padding:16px 16px 2px; }
  .chip { flex:1; border-radius:24px; padding:13px 8px; text-align:center; box-shadow:var(--chunky); position:relative; overflow:hidden; }
  .chip .sh { position:absolute; top:6px; left:12px; right:12px; height:11px; border-radius:11px; background:rgba(255,255,255,.5); }
  .chip.weekend { background:linear-gradient(160deg,#c9a8ff,#a87fff); color:#fff; }
  .chip.half { background:linear-gradient(160deg,#ffc9a8,#ff9e7a); color:#5a3020; }
  .chip .big { font-family:'Baloo 2',cursive; font-weight:800; font-size:1.7rem; line-height:1; position:relative; }
  .chip .lbl { font-weight:800; font-size:.7rem; margin-top:4px; }

  .weekpick { display:flex; gap:9px; padding:14px 16px 0; }
  .weekbtn { flex:1; font-family:'Baloo 2',cursive; font-weight:700; font-size:.9rem; padding:11px; border:none; border-radius:20px; background:#fff; color:var(--ink-soft); box-shadow:var(--chunky); cursor:pointer; }
  .weekbtn:active{ transform:translateY(2px); }
  .weekbtn.on.a { background:linear-gradient(160deg,#ff9ec4,#ff4f95); color:#fff; }
  .weekbtn.on.b { background:linear-gradient(160deg,#c9a8ff,#8a7fff); color:#fff; }

  .viewswitch { display:flex; gap:8px; padding:14px 16px 0; overflow-x:auto; scrollbar-width:none; }
  .viewswitch::-webkit-scrollbar{ display:none; }
  .viewbtn { flex:0 0 auto; display:flex; align-items:center; gap:6px; font-family:'Baloo 2',cursive; font-weight:600; font-size:.9rem; padding:9px 15px; border:none; border-radius:30px; background:#fff; color:var(--ink-soft); box-shadow:var(--chunky); cursor:pointer; }
  .viewbtn:active{ transform:translateY(2px); }
  .viewbtn.on { background:var(--hot); color:#fff; }

  .tabs { display:flex; gap:8px; padding:12px 16px 6px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab { flex:0 0 auto; font-family:'Baloo 2',cursive; font-weight:700; font-size:.92rem; padding:9px 16px; border:none; border-radius:30px; background:#fff; color:var(--ink-soft); box-shadow:var(--chunky); cursor:pointer; }
  .tab:active{ transform:translateY(2px); }
  .tab.on { background:var(--hot); color:#fff; }

  .ringrow { display:flex; align-items:center; gap:16px; margin:12px 18px 6px; background:#fff; border-radius:28px; padding:16px 18px; box-shadow:var(--chunky); }
  .ring { --pct:0; flex:0 0 auto; width:78px; height:78px; border-radius:50%; background:conic-gradient(var(--hot) calc(var(--pct)*1%), #ffe0ee 0); display:flex; align-items:center; justify-content:center; transition:background .5s ease; }
  .ring-inner { width:60px; height:60px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',cursive; font-weight:800; font-size:1.2rem; color:var(--hot); }
  .ring-txt { flex:1; }
  .ring-txt .r-day { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.3rem; }
  .ring-txt .r-sub { font-size:.86rem; color:var(--ink-soft); font-weight:700; margin-top:2px; }

  .lessons { padding:6px 16px 6px; }
  .lesson { display:flex; align-items:center; gap:13px; background:var(--card); border-radius:26px; padding:13px 15px; margin-bottom:11px; box-shadow:var(--chunky); border-left:9px solid var(--c); position:relative; cursor:pointer; transition:transform .1s, opacity .2s; }
  .lesson:active{ transform:translateY(2px); }
  .lesson.done { opacity:.5; }
  .lesson.done .subject { text-decoration:line-through; }
  .l-doodle { flex:0 0 auto; width:46px; height:46px; border-radius:16px; background:color-mix(in srgb, var(--c) 16%, white); display:flex; align-items:center; justify-content:center; }
  .info { flex:1; min-width:0; }
  .subject { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.14rem; line-height:1.1; }
  .meta { font-size:.83rem; color:var(--ink-soft); font-weight:700; margin-top:1px; }
  .time { flex:0 0 auto; text-align:right; font-family:'Baloo 2',cursive; font-weight:700; color:var(--c); font-size:.92rem; }
  .time small { display:block; color:var(--ink-soft); font-weight:700; font-size:.74rem; opacity:.8; }
  .tick { flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:3px solid var(--c); display:flex; align-items:center; justify-content:center; }
  .lesson.done .tick { background:var(--c); }
  .tick .mark { opacity:0; } .lesson.done .tick .mark { opacity:1; }

  .tap-hint { text-align:center; color:var(--ink-soft); font-size:.8rem; font-weight:700; padding:2px 0 12px; opacity:.9; }
  .reset { display:block; margin:2px auto 0; background:none; border:none; color:var(--ink-soft); font-family:'Nunito'; font-weight:800; font-size:.85rem; text-decoration:underline; cursor:pointer; }

  .dayhead { padding:14px 22px 4px; font-family:'Baloo 2',cursive; font-weight:700; font-size:1.3rem; }
  .cal-wrap { padding:6px 16px 10px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; padding:6px 4px 12px; }
  .cal-title { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.3rem; }
  .cal-nav { border:none; background:#fff; box-shadow:var(--chunky); width:42px; height:42px; border-radius:16px; font-size:1.3rem; font-weight:800; color:var(--hot); cursor:pointer; }
  .cal-nav:active{ transform:translateY(2px); }
  .cal-legend { display:flex; gap:14px; justify-content:center; padding:0 0 12px; font-weight:800; font-size:.82rem; color:var(--ink-soft); }
  .dot { display:inline-block; width:13px; height:13px; border-radius:5px; margin-right:5px; vertical-align:-1px; }
  .dot.a { background:var(--hot); } .dot.b { background:var(--lav); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-dow { text-align:center; font-weight:800; font-size:.72rem; color:var(--ink-soft); padding-bottom:4px; }
  .cal-cell { aspect-ratio:1; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Baloo 2',cursive; font-weight:700; font-size:.98rem; background:#fff; box-shadow:0 2px 0 var(--line); cursor:pointer; position:relative; }
  .cal-cell.blank { background:transparent; box-shadow:none; cursor:default; }
  .cal-cell.wa { background:#ffe0ee; } .cal-cell.wa .wtag { color:var(--hot); }
  .cal-cell.wb { background:#efe4ff; } .cal-cell.wb .wtag { color:var(--lav); }
  .cal-cell.weekend2 { opacity:.4; }
  .cal-cell.holiday { background:#fff0d6; }
  .cal-cell .wtag { font-size:.6rem; font-weight:800; margin-top:1px; }
  .cal-cell.today { outline:3px solid var(--hot); outline-offset:-3px; }
  .cal-cell:active:not(.blank){ transform:scale(.94); }
  .cal-note { text-align:center; font-size:.8rem; color:var(--ink-soft); font-weight:700; padding:12px 0 0; }


  .hw-btn { flex:0 0 auto; border:none; background:#ffe0ee; color:#ff4f95; font-family:'Baloo 2',cursive; font-weight:700; font-size:.72rem; padding:7px 9px; border-radius:12px; cursor:pointer; margin-right:2px; }
  .hw-btn.set { background:#ff4f95; color:#fff; }
  .hw-list { padding:6px 16px 10px; }
  .hw-empty { text-align:center; color:var(--ink-soft); font-weight:700; padding:30px 20px; background:#fff; border-radius:24px; box-shadow:var(--chunky); }
  .hw-card { background:#fff; border-radius:24px; padding:14px 16px; margin-bottom:12px; box-shadow:var(--chunky); border-left:9px solid #ff4f95; }
  .hw-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .hw-subj { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.12rem; }
  .hw-when { font-size:.78rem; color:var(--ink-soft); font-weight:800; white-space:nowrap; }
  .hw-note { font-size:.94rem; font-weight:700; margin-top:4px; }
  .hw-plat { display:inline-block; margin-top:8px; font-size:.72rem; font-weight:800; background:#ffe0ee; color:#ff4f95; padding:5px 11px; border-radius:12px; }
  .hw-done { margin-top:10px; border:none; background:#8a7fff; color:#fff; font-family:'Baloo 2',cursive; font-weight:700; padding:9px 14px; border-radius:14px; cursor:pointer; font-size:.88rem; display:block; }
  .hw-modal { position:fixed; inset:0; background:rgba(74,32,53,.5); display:flex; align-items:flex-end; justify-content:center; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; }
  .hw-modal.show { opacity:1; pointer-events:auto; }
  .hw-sheet { background:#fff; width:100%; max-width:520px; border-radius:28px 28px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,.25); }
  .hw-sheet h3 { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.35rem; }
  .hw-sheet .sub { color:var(--ink-soft); font-weight:800; font-size:.85rem; margin-bottom:14px; }
  .hw-sheet label { display:block; font-weight:800; font-size:.8rem; color:var(--ink-soft); margin:12px 0 6px; }
  .hw-sheet textarea, .hw-sheet input[type=date] { width:100%; border:2.5px solid var(--line); border-radius:16px; padding:12px; font-family:'Nunito'; font-weight:700; font-size:1rem; resize:vertical; }
  .hw-sheet textarea { min-height:64px; }
  .hw-sheet textarea:focus, .hw-sheet input[type=date]:focus { outline:none; border-color:#ff4f95; }
  .plat-row { display:flex; flex-wrap:wrap; gap:8px; }
  .plat-chip { border:2.5px solid var(--line); background:#fff; border-radius:14px; padding:8px 12px; font-weight:800; font-size:.85rem; cursor:pointer; }
  .plat-chip.on { border-color:#ff4f95; background:#ffe0ee; color:#ff4f95; }
  .hw-actions { display:flex; gap:10px; margin-top:18px; }
  .hw-save { flex:1; border:none; background:#7a4a63; color:#fff; font-family:'Baloo 2',cursive; font-weight:700; padding:14px; border-radius:18px; font-size:1.05rem; cursor:pointer; }
  .hw-clear { border:none; background:#ffe0ee; color:#ff4f95; font-family:'Baloo 2',cursive; font-weight:700; padding:14px 16px; border-radius:18px; font-size:1.05rem; cursor:pointer; }

  .joke { margin:14px 16px 2px; background:#fff; border-radius:22px; padding:14px 16px; cursor:pointer; box-shadow:var(--chunky); }
  .joke-lbl { font-size:.76rem; font-weight:800; color:var(--ink-soft); }
  .joke-q { font-family:'Baloo 2',cursive; font-weight:600; font-size:1.06rem; margin-top:4px; }
  .joke-a { font-weight:800; font-size:1.02rem; color:#ff4f95; max-height:0; overflow:hidden; transition:max-height .3s ease, margin .3s ease; }
  .joke.open .joke-a { max-height:90px; margin-top:7px; }
  .joke .tap { font-size:.7rem; color:var(--ink-soft); font-weight:700; margin-top:6px; }

  .chip.stars { background:linear-gradient(160deg,#ffe17a,#ffb43f); color:#5a3a00; }
  .chip.streak { background:linear-gradient(160deg,#ff9ec4,#ff4f95); color:#fff; }

  .goal { margin:14px 16px 2px; background:#fff; border-radius:22px; padding:14px 16px; box-shadow:var(--chunky); }
  .goal-lbl { font-size:.78rem; color:var(--ink-soft); font-weight:800; }
  .goal-set { display:flex; gap:8px; margin-top:8px; }
  .goal-set input { border:2.5px solid var(--line); border-radius:14px; padding:9px 11px; font-family:'Nunito'; font-weight:700; font-size:.92rem; }
  .goal-set input.g-name { flex:1; min-width:0; } .goal-set input.g-num { width:64px; }
  .goal-set button { border:none; background:#ff4f95; color:#fff; font-family:'Baloo 2',cursive; font-weight:700; padding:0 14px; border-radius:14px; cursor:pointer; }
  .goal-show .g-title { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.08rem; }
  .goal-track { background:var(--line); height:14px; border-radius:10px; overflow:hidden; margin-top:8px; }
  .goal-fill { height:100%; background:linear-gradient(90deg,#ff4f95,#ff4f95); border-radius:10px; transition:width .5s ease; }
  .goal-sub { font-size:.8rem; color:var(--ink-soft); font-weight:700; margin-top:6px; }
  .goal-edit { background:none; border:none; color:var(--ink-soft); font-family:'Nunito'; font-weight:800; font-size:.78rem; text-decoration:underline; cursor:pointer; margin-top:6px; padding:0; }

  .needcard { background:#fff; border-radius:22px; padding:13px 16px; box-shadow:var(--chunky); border-left:8px solid #5fbfb0; margin:14px 16px 0; }
  .needcard .n-lbl { font-family:'Baloo 2',cursive; font-weight:700; font-size:.98rem; margin-bottom:8px; }
  .need-item { display:flex; align-items:center; gap:10px; padding:6px 0; cursor:pointer; }
  .need-box { width:24px; height:24px; border-radius:8px; border:3px solid #5fbfb0; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .need-item.on .need-box { background:#5fbfb0; }
  .need-item .mk { opacity:0; } .need-item.on .mk { opacity:1; }
  .need-item.on .need-txt { text-decoration:line-through; opacity:.5; }
  .need-txt { font-size:.98rem; font-weight:700; }

  .pickup-banner { margin:14px 16px 0; }
  .pickup-banner .pb { display:flex; align-items:center; gap:12px; background:linear-gradient(160deg,#5fbfb0,#ff4f95); color:#fff; border-radius:22px; padding:14px 16px; box-shadow:var(--chunky); }
  .pickup-banner .pb .pb-txt b { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.16rem; display:block; }
  .pickup-banner .pb .pb-txt small { opacity:.95; font-size:.82rem; font-weight:700; }
  .pickup-banner .pb.unset { background:linear-gradient(160deg,#b6a8c8,#8a7aa0); }
  .pickup-wrap, .events-wrap { padding:6px 16px 10px; }
  .pickup-intro, .events-intro { font-size:.86rem; color:var(--ink-soft); font-weight:700; background:#fff; padding:12px 14px; border-radius:18px; margin-bottom:14px; box-shadow:var(--chunky); }
  .pickup-day { background:#fff; border-radius:20px; padding:14px 16px; margin-bottom:11px; box-shadow:var(--chunky); border-left:8px solid #5fbfb0; }
  .pickup-day .pd-day { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.1rem; margin-bottom:8px; }
  .pickup-day .pd-row { display:flex; gap:8px; }
  .pickup-day select, .pickup-day input { border:2.5px solid var(--line); border-radius:14px; padding:9px 11px; font-family:'Nunito'; font-weight:700; font-size:.92rem; background:#fff; }
  .pickup-day select { flex:0 0 auto; } .pickup-day input { flex:1; min-width:0; }

  .ev-add { background:#fff; border-radius:20px; padding:14px 16px; margin-bottom:14px; box-shadow:var(--chunky); }
  .ev-add label { display:block; font-weight:800; font-size:.78rem; color:var(--ink-soft); margin:8px 0 5px; }
  .ev-add input { width:100%; border:2.5px solid var(--line); border-radius:14px; padding:10px; font-family:'Nunito'; font-weight:700; font-size:.95rem; }
  .ev-add button { width:100%; border:none; background:#7a4a63; color:#fff; font-family:'Baloo 2',cursive; font-weight:700; padding:12px; border-radius:16px; margin-top:12px; cursor:pointer; }
  .ev-card { background:#fff; border-radius:18px; padding:13px 16px; margin-bottom:10px; box-shadow:var(--chunky); border-left:8px solid #ff4f95; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .ev-card .ev-name { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.05rem; }
  .ev-card .ev-when { font-size:.8rem; color:var(--ink-soft); font-weight:700; }
  .ev-card .ev-count { font-family:'Baloo 2',cursive; font-weight:800; font-size:1.4rem; color:#ff4f95; text-align:center; line-height:1; }
  .ev-card .ev-count small { display:block; font-size:.62rem; color:var(--ink-soft); font-weight:700; }
  .ev-card .ev-del { border:none; background:none; color:var(--ink-soft); font-size:1.1rem; cursor:pointer; }


  .factcard { margin:12px 16px 2px; border-radius:22px; padding:16px; box-shadow:var(--chunky); }
  .factcard.locked { background:repeating-linear-gradient(45deg,#f1ecf8,#f1ecf8 10px,#eae3f4 10px,#eae3f4 20px); color:var(--ink-soft); text-align:center; }
  .factcard.locked .fc-lock { font-size:1.6rem; }
  .factcard.locked .fc-msg { font-weight:800; font-size:.9rem; margin-top:4px; }
  .factcard.unlocked { background:#fff; border-left:8px solid #3d7bff; }
  .factcard .fc-lbl { font-size:.76rem; font-weight:800; color:var(--ink-soft); }
  .factcard .fc-body { font-family:'Baloo 2',cursive; font-weight:600; font-size:1.08rem; margin-top:5px; line-height:1.35; }

  .pe-banner { margin:14px 16px 0; }
  .pe-banner .peb { display:flex; align-items:center; gap:12px; background:linear-gradient(160deg,#ff9d5a,#ff7a3d); color:#fff; border-radius:22px; padding:14px 16px; box-shadow:var(--chunky); }
  .pe-banner .peb .peb-emoji { font-size:1.7rem; }
  .pe-banner .peb b { font-family:inherit; font-weight:800; font-size:1.12rem; display:block; }
  .pe-banner .peb small { opacity:.95; font-size:.82rem; font-weight:700; }

  .walkhome { margin:14px 16px 0; }
  .walkhome .wh { display:flex; align-items:center; gap:12px; background:#fff; border-radius:22px; padding:14px 16px; box-shadow:var(--chunky); border-left:8px solid var(--mint,#3fb46e); cursor:pointer; }
  .walkhome .wh .wh-box { width:30px; height:30px; border-radius:9px; border:3px solid var(--mint,#3fb46e); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .walkhome .wh.done .wh-box { background:var(--mint,#3fb46e); }
  .walkhome .wh .wh-mk { opacity:0; } .walkhome .wh.done .wh-mk { opacity:1; }
  .walkhome .wh b { font-family:inherit; font-weight:800; font-size:1.06rem; display:block; }
  .walkhome .wh small { color:var(--ink-soft); font-weight:700; font-size:.82rem; }
  .walkhome .wh.done b { text-decoration:line-through; opacity:.6; }

  .reminders { margin:14px 16px 0; display:flex; flex-direction:column; gap:9px; }
  .reminder { display:flex; align-items:center; gap:11px; border-radius:20px; padding:12px 15px; box-shadow:var(--chunky); }
  .reminder .rm-emoji { font-size:1.4rem; }

function todayDateKey(){var dt=dateForDay(week,current);return dt?(dt.getFullYear()+"-"+(dt.getMonth()+1)+"-"+dt.getDate()):("gen-"+week+"-"+current);}
function renderWalk(){var box=document.getElementById("walkHome");if(!box)return;var k=todayDateKey();var on=!!walked[k];box.innerHTML='<div class="wh'+(on?' done':'')+'"><div class="wh-box"><svg class="wh-mk" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 13 10 18 19 6"/></svg></div><div><b>Walked home \uD83D\uDEB6</b><small>'+(on?'nice one \u2014 +2 stars earned':'tick when you get home safe')+'</small></div></div>';box.querySelector(".wh").onclick=function(){var kk=todayDateKey();if(walked[kk]){delete walked[kk];sset(WALK_KEY,walked);renderWalk();}else{walked[kk]=true;sset(WALK_KEY,walked);addStar(2);buzz([20,40,20]);confettiBurst();cheer("home safe \u2661");renderWalk();}};}
var calCursor=new Date(today.getFullYear(),today.getMonth(),1);
function calMove(step){calCursor.setMonth(calCursor.getMonth()+step);renderCal();}
function renderCal(){var y=calCursor.getFullYear(),m=calCursor.getMonth();document.getElementById("calTitle").textContent=MONTHS[m]+" "+y;var grid=document.getElementById("calGrid");grid.innerHTML="";["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d){var el=document.createElement("div");el.className="cal-dow";el.textContent=d;grid.appendChild(el);});var first=new Date(y,m,1);var off=(first.getDay()+6)%7;for(var i=0;i<off;i++){var b=document.createElement("div");b.className="cal-cell blank";grid.appendChild(b);}var dim=new Date(y,m+1,0).getDate();for(var d=1;d<=dim;d++){var dt=new Date(y,m,d);dt.setHours(0,0,0,0);var dow=dt.getDay();var cell=document.createElement("div");var cls="cal-cell";var weekend=(dow===0||dow===6),holiday=isHoliday(dt),letter=weekLetterForDate(dt);if(holiday)cls+=" holiday";else if(weekend)cls+=" weekend2";else cls+=(letter==="A"?" wa":" wb");if(dt.getTime()===today.getTime())cls+=" today";cell.className=cls;cell.innerHTML='<span>'+d+'</span>'+((!weekend&&!holiday)?'<span class="wtag">'+letter+'</span>':'');if(!weekend&&!holiday){(function(letter,dow){cell.onclick=function(){week=letter;current=DAYS[dow-1];setView('day');render();window.scrollTo({top:0,behavior:'smooth'});};})(letter,dow);}grid.appendChild(cell);}}
